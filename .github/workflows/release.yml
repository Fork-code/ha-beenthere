
name: BeenThere Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: beenthere-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before release
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate version and branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          version = os.environ["VERSION"]

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("Invalid version format")

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Release must run from main")

          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)

          if manifest["version"] != version:
              raise SystemExit(
                  f"Manifest version {manifest['version']} "
                  f"does not match {version}"
              )

          print(f"Ready to release v{version}")
          PY

      - name: Check for existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" \
            >/dev/null 2>&1; then
            echo "Tag already exists"
            exit 1
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=(
            "v$VERSION"
            --target "$GITHUB_SHA"
            --title "BeenThere v$VERSION"
            --generate-notes
          )

          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"
