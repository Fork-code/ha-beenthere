
name: BeenThere CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # ============================================
  # HACS validation
  # ============================================
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  # ============================================
  # Home Assistant validation
  # ============================================
  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare temporary integration structure
        run: |
          mkdir -p /tmp/beenthere-stage/custom_components/beenthere

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='tests/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='*.pyc' \
            ./ /tmp/beenthere-stage/custom_components/beenthere/

          mkdir -p custom_components/beenthere

          cp -a /tmp/beenthere-stage/custom_components/beenthere/. \
            custom_components/beenthere/

          # Remove the root manifest so hassfest
          # validates only the staged integration.
          rm manifest.json

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  # ============================================
  # Python syntax validation
  # ============================================
  python:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          checked = 0

          for path in Path(".").rglob("*.py"):
              if any(part.startswith(".") for part in path.parts):
                  continue

              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path)
              )
              checked += 1

          print(f"Python syntax checks passed: {checked} files")
          PY

  # ============================================
  # Playwright browser tests
  # ============================================
  browser-tests:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify Playwright installation
        run: |
          python -c "from playwright.sync_api import sync_playwright; print('Playwright available')"

      - name: Verify browser tests are collected
        run: |
          python -m pytest tests/test_frontend_browser.py \
            --collect-only -q

      - name: Run browser tests
        run: |
          python -m pytest tests/test_frontend_browser.py \
            -v -ra -x \
            --junitxml=browser-test-results.xml

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: browser-test-results.xml
          if-no-files-found: ignore
